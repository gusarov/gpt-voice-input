name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug

      - name: Load signing bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ.get("ANDROID_SIGNING_BUNDLE", "").strip()
          if not raw:
              raise SystemExit("ANDROID_SIGNING_BUNDLE secret is missing")
          bundle = json.loads(base64.b64decode(raw).decode("utf-8"))
          values = {
              "GVI_KEYSTORE_BASE64": bundle["keystoreBase64"],
              "GVI_STORE_PASSWORD": bundle["storePassword"],
              "GVI_KEY_ALIAS": bundle["keyAlias"],
              "GVI_KEY_PASSWORD": bundle["keyPassword"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  env.write(f"{name}={value}\n")
          PY

      - name: Derive fork build version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "GVI_VERSION_NAME=1.0.15-gusarov.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "GVI_VERSION_CODE=$((100000 + COUNT))" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:assembleRelease

      - name: Verify release signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gpt-voice-input-gusarov
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
